name: Cross-platform alpha verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform subset for focused verification'
        type: choice
        default: all
        options:
          - all
          - windows
          - macos-arm64
permissions:
  contents: read
concurrency:
  group: platform-tests-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true
jobs:
  verify:
    # Private repository remains private; do not consume paid private CI minutes.
    if: github.event.repository.private == false
    timeout-minutes: 25
    env:
      # UTF-8 reporting/child streams; does not change Windows file-encoding defaults.
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows' && '[{"os":"windows-2022","python":"3.12"}]' || inputs.platform == 'macos-arm64' && '[{"os":"macos-15","python":"3.12"}]' || '[{"os":"macos-15","python":"3.12"},{"os":"macos-15-intel","python":"3.12"},{"os":"ubuntu-24.04","python":"3.12"},{"os":"ubuntu-24.04","python":"3.13"},{"os":"windows-2022","python":"3.12"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Ubuntu Qt/X11/software-GL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1-mesa-dri libopengl0 libxcursor1 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Audit source and release archive contents
        run: python scripts/audit_release_contents.py --source . --artifacts dist
      - name: Install wheel with GUI/test dependencies, not editable source
        run: python scripts/install_ci_wheel.py
      - name: Verify dependency resolution and installed package
        run: |
          python -m pip check
          dmri-studio --version
          python scripts/validate_installed_package.py
      - name: Isolated Windows gzip Unicode diagnostics
        if: runner.os == 'Windows'
        run: python scripts/diagnose_windows_io.py
      - name: Core, geometry, tractography, atlas, QC, setup and filesystem tests
        run: python -m pytest tests/core tests/cli tests/unit tests/test_atlas.py tests/test_scene.py tests/test_scene_operations.py --junitxml=core-tests.xml
      - name: Native macOS/Windows Qt behavior tests
        if: runner.os != 'Linux'
        run: python -m pytest tests/gui --junitxml=gui-tests.xml
      - name: Ubuntu Xvfb Qt behavior tests
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1440x960x24' python -m pytest tests/gui --junitxml=gui-tests.xml
      - name: Native macOS/Windows viewer smoke
        if: runner.os != 'Linux'
        run: python scripts/validate_platform_smoke.py --output platform-smoke
      - name: Ubuntu software-rendered viewer smoke
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1440x960x24' python scripts/validate_platform_smoke.py --output platform-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            *-tests.xml
            platform-smoke/*.png
            platform-smoke/validation.json
          if-no-files-found: ignore
